<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <title>PageantIndex Organizer OS</title>
  <meta name="description" content="Front-end preview of the PageantIndex organizer operating system for applications, candidates, judging, tabulation, voting, ticketing, event records, marketplace and intelligence.">
  <meta name="theme-color" content="#2a0814">
  <link rel="icon" href="/public/images/pageant-icon.png">
  <link rel="stylesheet" href="/platform/platform.css">
  <style>
    .journey-switch{position:fixed;right:18px;bottom:18px;z-index:90;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:#260812;color:#fff;box-shadow:0 14px 36px rgba(38,8,18,.24);font:800 10px Montserrat,Arial,sans-serif;text-decoration:none}
    .journey-switch:hover{background:#4f1027}
    @media(max-width:720px){
      .journey-switch{position:relative;right:auto;bottom:auto;z-index:1;width:calc(100% - 32px);min-height:48px;margin:14px 16px calc(92px + env(safe-area-inset-bottom));font-size:10px;box-shadow:0 10px 28px rgba(38,8,18,.12)}
    }
  </style>
</head>
<body>
  <div id="platform-app"></div>
  <a class="journey-switch" href="/experience/">View all user journeys</a>
  <script src="/platform/platform.js" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const moduleId = location.hash.replace(/^#/, "");
      if (!moduleId) return;
      document.querySelector(`[data-module="${CSS.escape(moduleId)}"]`)?.click();
    });
  </script>
</body>
</html>
