<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PageantIndex | The Global Network for Pageantry</title>
    <meta
      name="description"
      content="Create a verified pageant identity, document professional history, and connect candidates, professionals, organizations, editions, and confirmed roles worldwide."
    />
    <meta property="og:title" content="PageantIndex | The Global Network for Pageantry" />
    <meta
      property="og:description"
      content="The global professional identity and relationship infrastructure for pageantry."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pageant Index" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:image"
      content="https://www.pageantindex.com/public/images/hero-backstage-v2.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ff1478" />
    <link rel="canonical" href="https://www.pageantindex.com/" />
    <link rel="alternate" hreflang="en" href="https://www.pageantindex.com/" />
    <link rel="alternate" hreflang="x-default" href="https://www.pageantindex.com/" />
    <link rel="stylesheet" href="/public/style.css" />
    <link rel="icon" href="/public/images/pageant-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.pageantindex.com/#organization",
            "name": "Pageant Index",
            "slogan": "The Global Network for Pageantry",
            "url": "https://www.pageantindex.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.pageantindex.com/public/images/pageant-icon.png",
              "width": 512,
              "height": 512
            },
            "areaServed": "Worldwide"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.pageantindex.com/#website",
            "url": "https://www.pageantindex.com/",
            "name": "Pageant Index",
            "publisher": {
              "@id": "https://www.pageantindex.com/#organization"
            },
            "inLanguage": "en",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.pageantindex.com/directory/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body data-page="home">
    <div id="app"></div>
    <script src="/public/seo.js" defer></script>
    <script src="/public/app.js" defer></script>
    <script src="/public/private-package-gate.js" defer></script>
  </body>
</html>
