name: Launch visual QA

on:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright for QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve static branch
        run: |
          python3 -m http.server 4173 > /tmp/pageantindex-server.log 2>&1 &
          echo $! > /tmp/pageantindex-server.pid
          sleep 2
      - name: Render launch surfaces and interactions
        run: |
          cat > .launch-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const out = '/tmp/pageantindex-launch-qa';
          fs.mkdirSync(out, { recursive: true });
          const targets = [
            {name:'home',url:'http://127.0.0.1:4173/',marker:'The professional index of pageantry.'},
            {name:'directory',url:'http://127.0.0.1:4173/directory/',marker:'Search the global pageant industry.'},
            {name:'signup',url:'http://127.0.0.1:4173/sign-up/',marker:'Create your PageantIndex profile'},
            {name:'dashboard',url:'http://127.0.0.1:4173/dashboard/',marker:'Sign in to your profile dashboard'},
            {name:'candidate',url:'http://127.0.0.1:4173/candidate/',marker:'Candidate / Titleholder Profile'},
            {name:'organization',url:'http://127.0.0.1:4173/organization/',marker:'Pageant Organization Profile'},
            {name:'claim',url:'http://127.0.0.1:4173/claim-profile/',marker:'Claim a PageantIndex profile.'},
            {name:'profile-empty',url:'http://127.0.0.1:4173/profile/',marker:'Profile not specified'},
          ];

          const browser = await chromium.launch({headless:true});
          const results = [];

          async function prepareContext(viewport) {
            const context = await browser.newContext({viewport});
            await context.route('https://uwcqvsitjtknxsaypjxj.supabase.co/**', async route => {
              const url = route.request().url();
              const body = url.includes('/auth/v1/user') ? '{}' : '[]';
              await route.fulfill({status:200,contentType:'application/json',body});
            });
            return context;
          }

          async function run(viewport, suffix) {
            const context = await prepareContext(viewport);
            for (const target of targets) {
              console.log(`Rendering ${target.name} ${suffix}`);
              const page = await context.newPage();
              page.setDefaultTimeout(10000);
              const errors = [];
              page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
              page.on('console', message => {
                if (message.type() === 'error') errors.push(`console: ${message.text()}`);
              });
              const response = await page.goto(target.url, {waitUntil:'domcontentloaded', timeout:20000});
              await page.waitForTimeout(1200);
              const status = response?.status() || 0;
              const text = await page.evaluate(() => document.body?.innerText || '');
              if (status !== 200) throw new Error(`${target.name} returned ${status}`);
              if (!text.includes(target.marker)) {
                await page.screenshot({path:path.join(out,`${target.name}-${suffix}-failed.png`),fullPage:false});
                throw new Error(`${target.name} missing marker: ${target.marker}; url=${page.url()}; body=${text.slice(0,500)}`);
              }
              await page.screenshot({path:path.join(out,`${target.name}-${suffix}.png`),fullPage:true,timeout:10000});
              results.push({name:target.name,viewport:suffix,status,errors});
              if (errors.length) throw new Error(`${target.name} ${suffix} browser errors: ${errors.join(' | ')}`);
              await page.close();
            }
            await context.close();
          }

          await run({width:1440,height:1000},'desktop');
          await run({width:390,height:844},'mobile');

          const interactionContext = await prepareContext({width:390,height:844});
          const home = await interactionContext.newPage();
          await home.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded'});
          await home.locator('#pi-global-search input').fill('photographer');
          await Promise.all([
            home.waitForURL(/directory\/\?q=photographer/, {timeout:10000}),
            home.locator('#pi-global-search button').click(),
          ]);
          results.push({interaction:'home search',url:home.url()});
          await home.close();

          const candidate = await interactionContext.newPage();
          await candidate.goto('http://127.0.0.1:4173/candidate/', {waitUntil:'domcontentloaded'});
          await candidate.locator('[data-tab="invitations"]').click();
          if (!(await candidate.evaluate(() => document.body?.innerText || '')).includes('Personal supplier invitations')) {
            throw new Error('Candidate invitations interaction failed');
          }
          results.push({interaction:'candidate invitations',passed:true});
          await candidate.close();

          const organization = await interactionContext.newPage();
          await organization.goto('http://127.0.0.1:4173/organization/', {waitUntil:'domcontentloaded'});
          await organization.locator('[data-tab="invitations"]').click();
          if (!(await organization.evaluate(() => document.body?.innerText || '')).includes('Official supplier invitations')) {
            throw new Error('Organization invitations interaction failed');
          }
          results.push({interaction:'organization invitations',passed:true});
          await organization.close();
          await interactionContext.close();
          await browser.close();

          fs.writeFileSync(path.join(out,'results.json'), JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          EOF
          node .launch-qa.mjs
          rm -f .launch-qa.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pageantindex-launch-visual-qa
          path: /tmp/pageantindex-launch-qa
          if-no-files-found: error
