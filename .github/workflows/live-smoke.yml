name: Live production smoke test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PageantIndex production routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://www.pageantindex.com"

          check() {
            path="$1"
            expected="$2"
            tmp="$(mktemp)"
            code="$(curl --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 30 -sS -L -o "$tmp" -w '%{http_code}' "$base$path")"
            echo "$path -> HTTP $code"
            test "$code" = "200"
            grep -Fq "$expected" "$tmp" || {
              echo "Expected marker not found on $path: $expected"
              echo "--- response preview ---"
              head -c 1000 "$tmp"
              exit 1
            }
          }

          check "/" "PageantIndex"
          check "/organization/" "Pageant Organization | PageantIndex"
          check "/platform/" "PageantIndex Organizer OS"
          check "/experience/" "PageantIndex User Experiences"
          check "/candidate/" "Candidate Portal | PageantIndex"
          check "/judge/" "Judge Scoring | PageantIndex"
          check "/vote/" "People's Choice Voting | PageantIndex"
          check "/tickets/" "Tickets | PageantIndex"
          check "/supplier-workspace/" "Supplier Workspace | PageantIndex"
          check "/tabulation/" "Tabulation Control Room | PageantIndex"
          check "/event/" "Official Event | PageantIndex"

          echo "All PageantIndex production routes returned HTTP 200 with the expected deployed HTML markers."
